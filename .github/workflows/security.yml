name: Security checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan repository for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  migration-safety:
    name: Review migration safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Flag destructive migration changes for manual review
        run: node scripts/check-migrations.mjs
